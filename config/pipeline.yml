# Settings for the R targets pipeline in r_pilot/.
# Relative paths are relative to the repo root.
# The last year and month come from latestdata in config/release.yml.
first_year: 1976
# May supplement extracts (Unicon files)
may_years:
  first: 1973
  last: 1981
# months with no CPS data at all (October 2025 was not collected: federal shutdown)
skip_months: ["2025m10"]
# Census-2000-based reweights (nwsswgt, nwcmpwgt, nworwgt) replace the regular weights in these years
reweight_years:
  first: 2000
  last: 2002
paths:
  raw_ascii: /data/cps/basic/census/raw
  # Unicon .dta files for 1976-1993 (separate ORG files: 1979-1983)
  unicon_basic: /data/cps/basic/unicon
  unicon_org: /data/cps/org/unicon
  unicon_may: /data/cps/may/unicon
  reference: /data/cps
  dictionaries: code/dictionaries
  suppdata: suppdata
  cache: r_pilot/cache
  reports: r_pilot/reports
# parallel targets workers: one worker peaks at about 9 GB resident (1996,
# measured Oct 2026); keep workers x 9 GB well under the server's free memory
# (8 workers crashed it, Oct 2026; see CLAUDE.md)
workers: 1
# memory cap per worker (unix::rlimit_as): a worker that goes over stops with
# an error instead of taking down the server. It caps virtual memory, which
# runs about 1.5x resident with arrow (peak 14.2 GB virtual / 9.2 GB resident),
# so 16 here means roughly 11 GB of real memory
worker_memory_gb: 16
# targets each worker runs before crew replaces it with a fresh process. A
# long-lived worker keeps several GB from earlier targets (R and arrow don't
# release it), and that build-up hit the cap; 1 starts every target clean
worker_tasks_max: 1
# where tar_make() writes the release files (.dta, .feather). Read apart from
# `config`, so pointing it elsewhere (e.g. r_pilot/scratch/ for a simulated
# release) only rewrites the files
output_dir: r_pilot/output
