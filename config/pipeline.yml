# Settings for the R targets pipeline in r_pilot/.
# Relative paths are relative to the repo root.
years:
  first: 2000
  last: 2024
# months with no CPS data at all (October 2025 was not collected: federal shutdown)
skip_months: ["2025m10"]
# Census-2000-based reweights (nwcmpwgt, nworwgt) replace the regular weights in these years
reweight_years:
  first: 2000
  last: 2002
paths:
  raw_ascii: /data/cps/basic/census/raw
  reference: /data/cps
  dictionaries: code/dictionaries
  suppdata: suppdata
  cache: r_pilot/cache
  output: r_pilot/output
  reports: r_pilot/reports
# parallel targets workers (each holds about one year of data in memory)
workers: 8
